<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Google</title>
</head>
<body>
    <div>
        <h1>Google Form</h1>
        <form action="https://www.google.com/search?">
            <input type="text" name="q" placeholder="Digite sua pesquisa">
            <input type="submit" value="Pesquisar">
            <!-- <button>Enviar</button> -->
        </form>
    </div>
    <div>
        <h1>Whats Form</h1>
        <form action="https://wa.me/5585982216221">
            <input type="tel" name="text" placeholder="Digite sua mensagem">
            <input type="submit" value="Pesquisar">
            <!-- <button>Enviar</button> -->
        </form>
    </div>
    <div class="form-inline">
                <div>
                    <label for="">Nome</label>
                    <input type="text" placeholder="Seu nome completo">
                </div>
                <div>
                    <label for="">E-mail</label>
                    <input type="text" placeholder="voce@exemplo.com">
                </div>
            </div>
            <div class="input-radio">
                    <span>O que te interessa?</span>
                    <input type="radio">
                    <label >Só o catalogo</label>
                    <input type="radio">
                    <label >Uma peça específica</label>
                    <input type="radio">
                    <label >Encomenda sob medida</label>
            </div>
            <div>
                <span>O que mais se encaixa no seu estilo</span>
                <input type="checkbox">
                <label>Terracota</label>
                <input type="checkbox">
                <label>Off White</label>
                <input type="checkbox">
                <label>Black</label>
            </div>
</body>
</html>
